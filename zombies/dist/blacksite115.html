<title>BLACKSITE 115</title>
<style>
  :root {
    --bone: #e8e0cc; --blood: #a11f1f; --blood2: #ff3020; --gold: #d8b04a;
    --spread: 6px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'Trebuchet MS', 'DejaVu Sans', Verdana, sans-serif; color: var(--bone); user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #hud.on { opacity: 1; }
  .hudtxt { text-shadow: 0 0 6px rgba(0,0,0,.9), 0 2px 2px rgba(0,0,0,.8); }

  #crosshair { position: fixed; left: 50%; top: 50%; width: 0; height: 0; }
  .xline { position: absolute; background: rgba(240,240,230,.85); box-shadow: 0 0 2px rgba(0,0,0,.9); }
  .xline.t { left: -1px; top: calc(-6px - var(--spread)); width: 2px; height: 7px; }
  .xline.b { left: -1px; top: calc(-1px + var(--spread)); width: 2px; height: 7px; }
  .xline.l { top: -1px; left: calc(-6px - var(--spread)); height: 2px; width: 7px; }
  .xline.r { top: -1px; left: calc(-1px + var(--spread)); height: 2px; width: 7px; }
  #crosshair.ads .xline { opacity: 0; }

  #hitmarker { position: fixed; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
  #hitmarker.show { opacity: 1; }
  .hm { position: absolute; width: 2px; height: 9px; background: #fff; box-shadow: 0 0 3px rgba(0,0,0,.9); }
  #hitmarker.kill .hm { background: var(--blood2); }
  .hm1 { transform: translate(-7px,-11px) rotate(45deg); }
  .hm2 { transform: translate(5px,-11px) rotate(-45deg); }
  .hm3 { transform: translate(-7px,2px) rotate(-45deg); }
  .hm4 { transform: translate(5px,2px) rotate(45deg); }

  #round { position: fixed; left: 26px; bottom: 18px; font-size: 64px; font-weight: 900;
    color: var(--blood2); font-family: Georgia, 'Times New Roman', serif; line-height: 1;
    text-shadow: 0 0 14px rgba(120,0,0,.95), 0 0 40px rgba(160,10,10,.6), 0 2px 3px #000; letter-spacing: 2px; }
  #roundlbl { position: fixed; left: 28px; bottom: 88px; font-size: 12px; letter-spacing: 5px; color: #caa; opacity: .85; }

  #points { position: fixed; left: 120px; bottom: 30px; font-size: 26px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(#f4d98a, #c89638 55%, #a97e28);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.9)) drop-shadow(0 0 8px rgba(0,0,0,.6)); }
  #popups { position: fixed; left: 130px; bottom: 64px; width: 220px; }
  .pop { position: absolute; left: 0; bottom: 0; font-weight: 700; font-size: 18px; color: var(--gold);
    text-shadow: 0 0 6px #000; animation: popfly 0.9s ease-out forwards; }
  .pop.neg { color: #d33; }
  @keyframes popfly { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px); } }

  #weaponbox { position: fixed; right: 30px; bottom: 22px; text-align: right; padding: 8px 14px 6px 26px;
    background: linear-gradient(100deg, transparent, rgba(0,0,0,.42) 40%);
    border-right: 2px solid rgba(216,176,74,.5); border-radius: 2px; }
  #wname { font-size: 15px; letter-spacing: 3px; color: #cfc7b0; margin-bottom: 2px; }
  #wname.pap { color: #b070ff; text-shadow: 0 0 10px rgba(150,80,255,.8); }
  #ammo { font-size: 44px; font-weight: 800; line-height: 1; }
  #ammo .res { font-size: 22px; color: #9a9482; font-weight: 600; }
  #ammo.low { color: var(--blood2); }
  #grenades { font-size: 15px; color: #cfc7b0; margin-top: 4px; letter-spacing: 2px; }

  #health-vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(140,0,0,.55) 78%, rgba(90,0,0,.9) 100%); }

  #prompt { position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%); font-size: 17px;
    letter-spacing: 1px; background: rgba(0,0,0,.55); padding: 8px 18px; border: 1px solid rgba(216,176,74,.4);
    border-radius: 3px; opacity: 0; transition: opacity .15s; }
  #prompt.on { opacity: 1; }
  #prompt b { color: var(--gold); }

  #banner { position: fixed; left: 0; right: 0; top: 20%; text-align: center; font-size: 58px; font-weight: 900;
    font-family: Georgia, serif; color: var(--blood2); letter-spacing: 6px; opacity: 0; pointer-events: none;
    text-shadow: 0 0 20px rgba(140,0,0,.9), 0 3px 4px #000; }
  #banner.show { animation: bannerfade 3.4s ease-out forwards; }
  #banner.gold { color: var(--gold); text-shadow: 0 0 20px rgba(180,140,0,.9), 0 3px 4px #000; }
  @keyframes bannerfade { 0% { opacity: 0; transform: scale(1.25); } 12% { opacity: 1; transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; } }

  #subtitle { position: fixed; left: 0; right: 0; bottom: 14%; text-align: center; font-size: 16px;
    color: #d5cdb5; letter-spacing: 1px; opacity: 0; transition: opacity .3s; text-shadow: 0 1px 3px #000; }
  #subtitle.on { opacity: 1; }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 10;
    background:
      radial-gradient(ellipse 120% 90% at 50% 118%, rgba(120,14,8,.42), transparent 55%),
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(24,34,54,.5), transparent 60%),
      radial-gradient(ellipse 140% 120% at 50% 50%, rgba(2,3,6,.55) 40%, rgba(0,0,0,.92) 100%),
      linear-gradient(rgba(4,5,9,.55), rgba(3,3,6,.72)); }
  .overlay::after { /* drifting smoke sheet */
    content: ''; position: absolute; inset: -60% -30%; pointer-events: none; opacity: .16;
    background:
      radial-gradient(closest-side, rgba(200,210,230,.5), transparent 65%) 12% 30% / 42% 34% no-repeat,
      radial-gradient(closest-side, rgba(160,175,205,.4), transparent 60%) 70% 60% / 50% 40% no-repeat,
      radial-gradient(closest-side, rgba(190,200,225,.35), transparent 60%) 40% 78% / 46% 30% no-repeat;
    animation: fogdrift 26s linear infinite alternate; filter: blur(6px); }
  @keyframes fogdrift { from { transform: translate3d(-4%, 1%, 0) scale(1); } to { transform: translate3d(5%, -2%, 0) scale(1.12); } }
  .hidden { display: none !important; }
  /* military-stencil title: heavy system stack, per-letter paint-cut + jitter */
  .title { font-family: 'Arial Black', Impact, Haettenschweiler, 'Franklin Gothic Medium',
      'Liberation Sans', 'DejaVu Sans', sans-serif;
    font-weight: 900; font-size: clamp(40px, 7.4vw, 88px); letter-spacing: .06em; word-spacing: .3em;
    line-height: 1.05; color: #e8dfc6; z-index: 1; position: relative;
    text-shadow: 0 4px 3px rgba(0,0,0,.9), 0 0 34px rgba(160,24,14,.55), 0 0 9px rgba(226,214,182,.14), 0 1px 0 rgba(70,62,46,.9); }
  .title em { font-style: normal; color: #e03024;
    text-shadow: 0 4px 3px rgba(0,0,0,.92), 0 0 30px rgba(230,40,24,.6), 0 0 9px rgba(255,90,60,.3); }
  /* per-letter stencil plates: bone paint with a dark cut band, scratched by a
     diagonal wear pattern; --cut varies the band height letter to letter */
  .title .tl { display: inline-block; --cut: 47%; transform: scaleY(1.14);
    background-image:
      repeating-linear-gradient(112deg, rgba(0,0,0,0) 0 5px, rgba(30,24,16,.22) 5px 6.5px, rgba(0,0,0,0) 6.5px 12px),
      linear-gradient(180deg, #faf3e0 0%, #efe6ca calc(var(--cut) - 3%), #1a140a calc(var(--cut) - 1%),
        #27200f calc(var(--cut) + 4%), #e4d9b6 calc(var(--cut) + 6%), #c9bd97 90%, #b0a37c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    /* NOTE: text-shadow must stay off the clipped spans (Chromium paints an
       element's own text-shadow over background-clip:text fills) — depth and
       glow come from drop-shadow filters instead */
    text-shadow: none;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.85)) drop-shadow(0 0 13px rgba(150,24,14,.5)); }
  .title em .tl {
    background-image:
      repeating-linear-gradient(112deg, rgba(0,0,0,0) 0 5px, rgba(46,8,5,.30) 5px 6.5px, rgba(0,0,0,0) 6.5px 12px),
      linear-gradient(180deg, #ff7050 0%, #ea3d2c calc(var(--cut) - 3%), #260b06 calc(var(--cut) - 1%),
        #360f09 calc(var(--cut) + 4%), #d62a1a calc(var(--cut) + 6%), #a01b12 90%, #7c150d 100%);
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.9)) drop-shadow(0 0 12px rgba(230,40,24,.55)); }
  /* worn hand-stamped jitter — small rotations/offsets, deterministic per slot */
  .title .tl:nth-child(2n)   { transform: scaleY(1.14) rotate(.65deg) translateY(1px); --cut: 44%; }
  .title .tl:nth-child(3n+1) { transform: scaleY(1.14) rotate(-.8deg) translateY(-1px); --cut: 50%; }
  .title .tl:nth-child(5n+3) { transform: scaleY(1.14) rotate(1deg) translateY(1px); --cut: 43%; }
  .title .tl:nth-child(7n+4) { transform: scaleY(1.12) rotate(-.5deg); --cut: 52%; }
  /* grungier divider: slanted stencil dashes over a faint ember rule */
  .title::after { content: ''; display: block; height: 4px; margin: 15px 10px 0;
    background:
      linear-gradient(90deg, rgba(150,30,14,0), rgba(150,30,14,.5) 28%, rgba(150,30,14,.5) 72%, rgba(150,30,14,0)) 0 100% / 100% 1px no-repeat,
      repeating-linear-gradient(90deg, rgba(216,176,74,.8) 0 26px, rgba(216,176,74,.1) 26px 31px,
        rgba(196,156,64,.6) 31px 78px, rgba(216,176,74,0) 78px 92px,
        rgba(226,186,84,.72) 92px 140px, rgba(216,176,74,.16) 140px 146px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    transform: skewX(-24deg); box-shadow: 0 3px 14px rgba(190,120,40,.12); }
  .subtitle2 { margin-top: 14px; letter-spacing: 9px; font-size: 14px; color: #b8ae94; z-index: 1; }
  .deploy { margin-top: 44px; font-size: 21px; letter-spacing: 6px; padding: 15px 48px; color: var(--bone);
    border: 1px solid rgba(216,176,74,.55); background: linear-gradient(rgba(30,12,9,.75), rgba(14,6,5,.85));
    cursor: pointer; transition: all .22s; z-index: 1; box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 18px rgba(0,0,0,.55); }
  .deploy:hover { background: linear-gradient(rgba(140,26,16,.6), rgba(60,10,8,.8));
    box-shadow: 0 0 34px rgba(200,44,30,.45), inset 0 0 14px rgba(0,0,0,.5); letter-spacing: 8px; color: #fff; }
  .controls { margin-top: 38px; display: grid; grid-template-columns: auto auto; gap: 7px 24px; font-size: 13.5px;
    color: #9a927f; z-index: 1; }
  .controls b { color: #ded5bd; font-weight: 700; text-align: right; letter-spacing: 1px; }
  .lore { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: 11.5px;
    letter-spacing: 3px; color: #766e5c; z-index: 1; }
  #gameover .title { color: var(--blood2); }
  #gostats { margin-top: 26px; font-size: 19px; letter-spacing: 2px; color: #cfc7b0; text-align: center; line-height: 1.9; }
  #gostats b { color: var(--gold); }
  #paused-note { font-size: 20px; letter-spacing: 4px; }
</style>

<div id="app"></div>

<div id="hud">
  <div id="crosshair"><div class="xline t"></div><div class="xline b"></div><div class="xline l"></div><div class="xline r"></div></div>
  <div id="hitmarker"><div class="hm hm1"></div><div class="hm hm2"></div><div class="hm hm3"></div><div class="hm hm4"></div></div>
  <div id="health-vignette"></div>
  <div id="roundlbl" class="hudtxt">ROUND</div>
  <div id="round" class="hudtxt">1</div>
  <div id="points" class="hudtxt">500</div>
  <div id="popups"></div>
  <div id="weaponbox" class="hudtxt">
    <div id="wname">KESTREL .45</div>
    <div id="ammo">8 <span class="res">/ 96</span></div>
    <div id="grenades">✸ 2</div>
  </div>
  <div id="prompt"></div>
  <div id="banner"></div>
  <div id="subtitle"></div>
</div>

<div id="menu" class="overlay">
  <div class="title" aria-label="BLACKSITE 115"><span class="tl">B</span><span class="tl">L</span><span class="tl">A</span><span class="tl">C</span><span class="tl">K</span><span class="tl">S</span><span class="tl">I</span><span class="tl">T</span><span class="tl">E</span> <em><span class="tl">1</span><span class="tl">1</span><span class="tl">5</span></em></div>
  <div class="subtitle2">UNDEAD PROTOCOL — VERLASSEN</div>

  <div class="controls">
    <b>WASD</b><span>Move</span>

</div>

<div id="gameover" class="overlay hidden">
  <div class="title">YOU DIED</div>
  <div id="gostats"></div>
  <button class="deploy" id="btn-restart">TRY AGAIN</button>
</div>

<div id="paused" class="overlay hidden">
  <div id="paused-note">PAUSED — CLICK TO RESUME</div>
</div>
